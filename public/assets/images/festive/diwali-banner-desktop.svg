<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <title>Happy Diwali from Digicrome</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a2b"/>
      <stop offset=".5" stop-color="#1a1447"/>
      <stop offset="1" stop-color="#2e1c6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc135" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffc135" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.3" fill="#fff" fill-opacity=".45"/>
      <circle cx="58" cy="44" r="1" fill="#ffe7a3" fill-opacity=".5"/>
      <circle cx="30" cy="72" r=".9" fill="#fff" fill-opacity=".3"/>
      <circle cx="78" cy="8" r=".8" fill="#fff" fill-opacity=".35"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#f2b233"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc135" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffc135" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6d00"/>
      <stop offset=".55" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8711a"/>
      <stop offset="1" stop-color="#8d2c00"/>
    </linearGradient>
    <!-- One festive bulb, hanging from (0,0) -->
    <g id="bulb">
      <circle cy="13" r="13" fill="currentColor" fill-opacity=".3"/>
      <rect x="-2.6" y="-1" width="5.2" height="6" rx="1" fill="#b9a46a"/>
      <path d="M0 4.5c-3.6 0-5.4 3.4-5.4 7 0 4.2 2.8 7.6 5.4 9.5 2.6-1.9 5.4-5.3 5.4-9.5 0-3.6-1.8-7-5.4-7z" fill="currentColor"/>
      <ellipse cx="-1.8" cy="10" rx="1.2" ry="2.4" fill="#fff" fill-opacity=".7"/>
    </g>
    <!-- One swag of wire with five bulbs sitting on it -->
    <g id="swag">
      <path d="M0 34Q100 86 200 34" fill="none" stroke="#d4a017" stroke-opacity=".6" stroke-width="1.6"/>
      <use href="#bulb" x="20" y="43.4" color="#ffd36b"/>
      <use href="#bulb" x="60" y="55.8" color="#ff8a3d"/>
      <use href="#bulb" x="100" y="60" color="#ff5fa2"/>
      <use href="#bulb" x="140" y="55.8" color="#5fe3c0"/>
      <use href="#bulb" x="180" y="43.4" color="#7cb8ff"/>
    </g>
    <path id="spark" d="M0-12L2.6-2.6 12 0 2.6 2.6 0 12-2.6 2.6-12 0-2.6-2.6z"/>
    <ellipse id="pOuter" cy="-150" rx="22" ry="50"/>
    <ellipse id="pMid" cy="-98" rx="18" ry="38"/>
    <ellipse id="pInner" cy="-55" rx="13" ry="27"/>
    <g id="diya">
      <path d="M-150-40C-135 50 135 50 150-40z" fill="url(#clay)"/>
      <ellipse cy="-40" rx="152" ry="24" fill="#f59a3d"/>
      <ellipse cy="-40" rx="132" ry="14" fill="#6d2a00"/>
      <path d="M-112 2q112 40 224 0" stroke="#ffc135" stroke-width="5" fill="none" stroke-dasharray="1 15" stroke-linecap="round"/>
      <path d="M-92 22q92 26 184 0" stroke="#ffc135" stroke-width="2.5" fill="none" opacity=".7"/>
    </g>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#stars)"/>
  <circle cx="1210" cy="320" r="360" fill="url(#glow)"/>

  <rect y="20" width="1600" height="3" fill="#f6c453"/>
  <rect y="27" width="1600" height="1.5" fill="#f6c453" fill-opacity=".5"/>
  <rect y="577" width="1600" height="3" fill="#f6c453"/>
  <rect y="571.5" width="1600" height="1.5" fill="#f6c453" fill-opacity=".5"/>

  <use href="#swag"/>
  <use href="#swag" x="200"/>
  <use href="#swag" x="400"/>
  <use href="#swag" x="600"/>
  <use href="#swag" x="800"/>
  <use href="#swag" x="1000"/>
  <use href="#swag" x="1200"/>
  <use href="#swag" x="1400"/>

  <!-- Rangoli behind the diya -->
  <g transform="translate(1210 320)">
    <circle r="205" fill="none" stroke="#f6c453" stroke-width="2" stroke-dasharray="2 10" opacity=".7"/>
    <g fill="#ff5fa2" fill-opacity=".85">
      <use href="#pOuter"/><use href="#pOuter" transform="rotate(22.5)"/><use href="#pOuter" transform="rotate(45)"/><use href="#pOuter" transform="rotate(67.5)"/>
      <use href="#pOuter" transform="rotate(90)"/><use href="#pOuter" transform="rotate(112.5)"/><use href="#pOuter" transform="rotate(135)"/><use href="#pOuter" transform="rotate(157.5)"/>
      <use href="#pOuter" transform="rotate(180)"/><use href="#pOuter" transform="rotate(202.5)"/><use href="#pOuter" transform="rotate(225)"/><use href="#pOuter" transform="rotate(247.5)"/>
      <use href="#pOuter" transform="rotate(270)"/><use href="#pOuter" transform="rotate(292.5)"/><use href="#pOuter" transform="rotate(315)"/><use href="#pOuter" transform="rotate(337.5)"/>
    </g>
    <g fill="#ff8a3d">
      <use href="#pMid"/><use href="#pMid" transform="rotate(30)"/><use href="#pMid" transform="rotate(60)"/><use href="#pMid" transform="rotate(90)"/>
      <use href="#pMid" transform="rotate(120)"/><use href="#pMid" transform="rotate(150)"/><use href="#pMid" transform="rotate(180)"/><use href="#pMid" transform="rotate(210)"/>
      <use href="#pMid" transform="rotate(240)"/><use href="#pMid" transform="rotate(270)"/><use href="#pMid" transform="rotate(300)"/><use href="#pMid" transform="rotate(330)"/>
    </g>
    <g fill="#5fe3c0">
      <use href="#pInner"/><use href="#pInner" transform="rotate(45)"/><use href="#pInner" transform="rotate(90)"/><use href="#pInner" transform="rotate(135)"/>
      <use href="#pInner" transform="rotate(180)"/><use href="#pInner" transform="rotate(225)"/><use href="#pInner" transform="rotate(270)"/><use href="#pInner" transform="rotate(315)"/>
    </g>
    <circle r="34" fill="#ffc135"/>
    <circle r="18" fill="#ff5fa2"/>
  </g>

  <!-- Diya with its flame -->
  <g transform="translate(1210 450)">
    <circle cy="-110" r="120" fill="url(#flameGlow)"/>
    <path d="M0-170C-28-128-28-96 0-82C28-96 28-128 0-170z" fill="url(#flame)"/>
    <path d="M0-134C-12-112-10-94 0-88C10-94 12-112 0-134z" fill="#fffde7"/>
    <path d="M0-82v24" stroke="#4e342e" stroke-width="5" stroke-linecap="round"/>
    <use href="#diya"/>
  </g>

  <g fill="#ffd36b">
    <use href="#spark" transform="translate(960 150) scale(1.1)"/>
    <use href="#spark" transform="translate(1470 170) scale(1.4)"/>
    <use href="#spark" transform="translate(1490 470) scale(.9)"/>
    <use href="#spark" transform="translate(950 480) scale(1.2)"/>
  </g>
  <g fill="#fff" fill-opacity=".85">
    <use href="#spark" transform="translate(1380 110) scale(.7)"/>
    <use href="#spark" transform="translate(1030 250) scale(.6)"/>
  </g>

  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="110" width="260" height="50" rx="25" fill="#fff" fill-opacity=".08" stroke="#f6c453" stroke-opacity=".7" stroke-width="2"/>
    <text x="226" y="143" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="3" fill="#f6c453">HAPPY DIWALI</text>

    <text x="96" y="246" font-size="56" font-weight="800" fill="#fff">This Diwali, Gift a Friend</text>
    <text x="96" y="328" font-size="74" font-weight="800" fill="url(#gold)">Data Science &amp; AI</text>
    <text x="96" y="388" font-size="27" fill="#e9e4ff">Brighter than diyas — a career that lasts a lifetime.</text>

    <rect x="96" y="428" width="330" height="70" rx="35" fill="#ffc135"/>
    <text x="230" y="473" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1" fill="#1a1447">ENQUIRE NOW</text>
    <circle cx="384" cy="463" r="22" fill="#1a1447"/>
    <path d="M375 463h17m-7-7 7 7-7 7" stroke="#ffc135" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="96" y="540" font-size="17" font-weight="700" letter-spacing="5" fill="#f6c453" fill-opacity=".85">DIGICROME ACADEMY</text>
  </g>
</svg>
