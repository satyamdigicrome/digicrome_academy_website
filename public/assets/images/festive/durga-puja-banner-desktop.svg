<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <title>Shubho Durga Puja from Digicrome</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e0a14"/>
      <stop offset=".55" stop-color="#b3121f"/>
      <stop offset="1" stop-color="#d84315"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".08"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#f2b233"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="petalBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd6df"/>
      <stop offset="1" stop-color="#e94e77"/>
    </linearGradient>
    <path id="pet" d="M0 0C-22-22-18-62 0-82C18-62 22-22 0 0z"/>
    <g id="shiuli">
      <g fill="#fff">
        <ellipse cy="-6" rx="3.6" ry="5.8"/>
        <ellipse cy="-6" rx="3.6" ry="5.8" transform="rotate(72)"/>
        <ellipse cy="-6" rx="3.6" ry="5.8" transform="rotate(144)"/>
        <ellipse cy="-6" rx="3.6" ry="5.8" transform="rotate(216)"/>
        <ellipse cy="-6" rx="3.6" ry="5.8" transform="rotate(288)"/>
      </g>
      <circle r="2.8" fill="#ff6d00"/>
    </g>
    <!-- The red border of a white "laal paar" saree, flipped onto red -->
    <g id="border">
      <rect width="1600" height="4" fill="#f6c453"/>
      <rect y="7" width="1600" height="10" fill="#fff"/>
      <rect y="20" width="1600" height="4" fill="#f6c453"/>
    </g>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <circle cx="1190" cy="300" r="380" fill="url(#glow)"/>
  <use href="#border" y="20"/>
  <use href="#border" transform="translate(0 580) scale(1 -1)"/>

  <!-- Golden chalchitra halo behind a lotus -->
  <g transform="translate(1190 300)">
    <circle r="128" fill="#ffd27a" fill-opacity=".12"/>
    <g fill="none" stroke="#f6c453">
      <circle r="232" stroke-width="2" stroke-dasharray="3 10" opacity=".7"/>
      <circle r="210" stroke-width="5"/>
      <circle r="196" stroke-width="1.5" opacity=".6"/>
      <circle r="164" stroke-width="48" stroke-dasharray="4 24.62" opacity=".75"/>
      <circle r="132" stroke-width="2" opacity=".55"/>
    </g>
    <g transform="translate(0 150) scale(1.9)">
      <path d="M0 6C-40-6-82-2-114 18c42 6 84 2 114-12z" fill="#2e7d32"/>
      <path d="M0 6c40-12 82-8 114 12-42 6-84 2-114-12z" fill="#388e3c"/>
      <use href="#pet" fill="url(#petalBack)" transform="rotate(-75) scale(.92)"/>
      <use href="#pet" fill="url(#petalBack)" transform="rotate(75) scale(.92)"/>
      <use href="#pet" fill="url(#petalBack)" transform="rotate(-50) scale(.92)"/>
      <use href="#pet" fill="url(#petalBack)" transform="rotate(50) scale(.92)"/>
      <use href="#pet" fill="url(#petal)" stroke="#ffc2d1" transform="rotate(-25)"/>
      <use href="#pet" fill="url(#petal)" stroke="#ffc2d1" transform="rotate(25)"/>
      <use href="#pet" fill="url(#petal)" stroke="#ffc2d1"/>
    </g>
  </g>

  <use href="#shiuli" transform="translate(940 120) scale(1.8)"/>
  <use href="#shiuli" transform="translate(1450 140) scale(2)"/>
  <use href="#shiuli" transform="translate(1470 470) scale(1.6)"/>
  <use href="#shiuli" transform="translate(925 470) scale(1.7)"/>
  <use href="#shiuli" transform="translate(1320 80) scale(1.3)"/>
  <use href="#shiuli" transform="translate(1040 530) scale(1.2)"/>

  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="96" width="318" height="50" rx="25" fill="#fff" fill-opacity=".1" stroke="#f6c453" stroke-opacity=".7" stroke-width="2"/>
    <text x="255" y="129" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="3" fill="#f6c453">SHUBHO DURGA PUJA</text>

    <text x="96" y="236" font-size="56" font-weight="800" fill="#fff">This Puja, Gift a Friend</text>
    <text x="96" y="318" font-size="74" font-weight="800" fill="url(#gold)">Data Science &amp; AI</text>
    <text x="96" y="378" font-size="27" fill="#ffe9d6">Refer a friend to Digicrome and earn exciting rewards.</text>

    <rect x="96" y="420" width="330" height="70" rx="35" fill="#f6c453"/>
    <text x="230" y="465" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1" fill="#1a1447">ENQUIRE NOW</text>
    <circle cx="384" cy="455" r="22" fill="#1a1447"/>
    <path d="M375 455h17m-7-7 7 7-7 7" stroke="#f6c453" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="96" y="532" font-size="17" font-weight="700" letter-spacing="5" fill="#f6c453" fill-opacity=".85">DIGICROME ACADEMY</text>
  </g>
</svg>
